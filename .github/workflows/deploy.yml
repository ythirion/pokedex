name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CHANGELOG
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit CHANGELOG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md"
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        run: |
          npm run dev &
          npx wait-on http://localhost:5173/

      - name: Accessibility tests
        run: npm run test:accessibility

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: GreenIT Analysis
        uses: ythirion/greenit-analysis-action@v0.1.2

      - name: Create 404.html for GitHub Pages
        run: cp build/200.html build/404.html

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'
          retention-days: '1'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  observatory:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Mozilla Observatory Scan
        run: |
          HOST=$(echo "${{ needs.deploy.outputs.page_url }}" | sed 's|https\?://||;s|/||g')
          RESULT=$(curl -s "https://observatory-api.mdn.mozilla.net/api/v2/scan?host=${HOST}")
          echo "$RESULT" | jq .
          mkdir -p observatory_results
          echo "$RESULT" | jq . > observatory_results/report.json
          GRADE=$(echo "$RESULT" | jq -r '.grade // "N/A"')
          SCORE=$(echo "$RESULT" | jq -r '.score // "N/A"')
          echo "### Mozilla Observatory" >> $GITHUB_STEP_SUMMARY
          echo "- **Host:** ${HOST}" >> $GITHUB_STEP_SUMMARY
          echo "- **Grade:** ${GRADE}" >> $GITHUB_STEP_SUMMARY
          echo "- **Score:** ${SCORE}/100" >> $GITHUB_STEP_SUMMARY

      - name: Upload Observatory Report
        uses: actions/upload-artifact@v4
        with:
          name: observatory-report
          path: observatory_results/
          retention-days: 7
