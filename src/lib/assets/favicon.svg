<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Pokéball SVG -->
  <!-- Top half (red) -->
  <path d="M 50,5 A 45,45 0 0 1 95,50 L 50,50 Z" fill="#EF4444"/>

  <!-- Bottom half (white) -->
  <path d="M 50,50 L 95,50 A 45,45 0 0 1 5,50 L 50,50 Z" fill="#FFFFFF"/>
  <path d="M 50,50 L 5,50 A 45,45 0 0 0 50,95 Z" fill="#FFFFFF"/>

  <!-- Middle black band -->
  <rect x="0" y="45" width="100" height="10" fill="#1F2937"/>

  <!-- Center white circle -->
  <circle cx="50" cy="50" r="15" fill="#FFFFFF" stroke="#1F2937" stroke-width="3"/>

  <!-- Center inner circle -->
  <circle cx="50" cy="50" r="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>

  <!-- Outer border -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#1F2937" stroke-width="3"/>
</svg>
